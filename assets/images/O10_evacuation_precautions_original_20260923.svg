<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">避難するときの注意</title><desc id="dsc">避難時の一般的な注意事項を示す図。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">避難するときの注意</text><rect x="50" y="155" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="50" y="155" width="265" height="12" rx="5" fill="#d8ecf4" stroke="none"/><text x="68" y="211" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">早めに判断</text><text x="68" y="258" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">暗くなる前に</text><rect x="348" y="155" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="348" y="155" width="265" height="12" rx="5" fill="#eab85c" stroke="none"/><text x="366" y="211" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">安全な経路</text><text x="366" y="258" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">冠水した道を避ける</text><rect x="646" y="155" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="646" y="155" width="265" height="12" rx="5" fill="#4f9272" stroke="none"/><text x="664" y="211" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">家族で確認</text><text x="664" y="258" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">連絡・持ち物</text><text x="85" y="420" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="500">移動が危険な状況では、命を守る行動を優先</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>