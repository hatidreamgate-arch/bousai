<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">高潮のしくみ</title><desc id="dsc">海面上昇と沿岸の住宅を示す模式図。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">高潮のしくみ</text><path d="M150 300 L220 235 L290 300" fill="none" stroke="#18384a" stroke-width="6" stroke-linejoin="round"/><rect x="168" y="300" width="104" height="95" rx="4" fill="white" stroke="#18384a" stroke-width="4"/><rect x="208" y="340" width="28" height="55" fill="#d8ecf4" stroke="#18384a" stroke-width="3"/><rect x="48" y="410" width="864" height="72" rx="12" fill="#287aaa" stroke="none"/><path d="M480 380 L480 470" fill="none" stroke="#18384a" stroke-width="10" stroke-linecap="round"/><text x="520" y="210" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="24" font-weight="500">台風などで海面が上がる</text><text x="520" y="265" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="21" font-weight="500">海水が沿岸へ押し寄せる</text><text x="680" y="400" fill="white" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="22" font-weight="500">海</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>