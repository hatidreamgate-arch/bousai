<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">浸水の深さと続く時間</title><desc id="dsc">浸水の深さと継続時間は別々に確認することを示す模式図。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">浸水の深さと続く時間</text><path d="M150 270 L220 205 L290 270" fill="none" stroke="#18384a" stroke-width="6" stroke-linejoin="round"/><rect x="168" y="270" width="104" height="95" rx="4" fill="white" stroke="#18384a" stroke-width="4"/><rect x="208" y="310" width="28" height="55" fill="#d8ecf4" stroke="#18384a" stroke-width="3"/><rect x="48" y="365" width="420" height="110" rx="12" fill="#287aaa" stroke="none"/><path d="M500 135 L500 460" fill="none" stroke="#abc4cb" stroke-width="3" stroke-linecap="round"/><rect x="540" y="144" width="340" height="168" rx="18" fill="white" stroke="none"/><rect x="540" y="144" width="340" height="12" rx="5" fill="#d8ecf4" stroke="none"/><text x="558" y="200" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">浸水深</text><text x="558" y="247" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">どこまで水が来る？</text><rect x="540" y="335" width="340" height="168" rx="18" fill="white" stroke="none"/><rect x="540" y="335" width="340" height="12" rx="5" fill="#eab85c" stroke="none"/><text x="558" y="391" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">浸水継続時間</text><text x="558" y="438" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">どれくらい続く？</text><text x="115" y="345" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">深さの例（模式）</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>