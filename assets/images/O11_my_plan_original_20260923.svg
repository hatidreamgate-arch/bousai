<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">私の避難計画をつくる</title><desc id="dsc">マイ・タイムラインの考え方を参考にした独自の三段階の行動例。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">私の避難計画をつくる</text><rect x="50" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="50" y="160" width="265" height="12" rx="5" fill="#d8ecf4" stroke="none"/><text x="68" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">① 先に調べる</text><text x="68" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">自宅の危険</text><rect x="348" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="348" y="160" width="265" height="12" rx="5" fill="#eab85c" stroke="none"/><text x="366" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">② 決めておく</text><text x="366" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">避難先・連絡</text><rect x="646" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="646" y="160" width="265" height="12" rx="5" fill="#4f9272" stroke="none"/><text x="664" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">③ 行動する</text><text x="664" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">いつ・誰と・どう</text><text x="115" y="423" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="500">家族の事情に合わせて、平常時に書き出そう</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>