<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">避難先を考える</title><desc id="dsc">立退き避難と屋内安全確保の概念図。安全性は個別条件で判断する。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">避難先を考える</text><rect x="88" y="180" width="360" height="168" rx="18" fill="white" stroke="none"/><rect x="88" y="180" width="360" height="12" rx="5" fill="#d8ecf4" stroke="none"/><text x="106" y="236" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">立退き避難</text><text x="106" y="283" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">安全な場所へ移動</text><rect x="512" y="180" width="360" height="168" rx="18" fill="white" stroke="none"/><rect x="512" y="180" width="360" height="12" rx="5" fill="#4f9272" stroke="none"/><text x="530" y="236" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">屋内安全確保</text><text x="530" y="283" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">安全な階などへ</text><text x="106" y="435" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="22" font-weight="500">自宅の浸水・倒壊の危険と避難情報を確認</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>