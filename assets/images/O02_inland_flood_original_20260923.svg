<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">内水氾濫のしくみ</title><desc id="dsc">排水が追いつかず道路に水がたまる模式図。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">内水氾濫のしくみ</text><path d="M115 285 L185 220 L255 285" fill="none" stroke="#18384a" stroke-width="6" stroke-linejoin="round"/><rect x="133" y="285" width="104" height="95" rx="4" fill="white" stroke="#18384a" stroke-width="4"/><rect x="173" y="325" width="28" height="55" fill="#d8ecf4" stroke="#18384a" stroke-width="3"/><rect x="45" y="416" width="870" height="65" rx="12" fill="#d8ecf4" stroke="none"/><circle cx="610" cy="145" r="22" fill="#287aaa"/><circle cx="675" cy="175" r="15" fill="#287aaa"/><circle cx="750" cy="138" r="20" fill="#287aaa"/><path d="M610 220 L610 402" fill="none" stroke="#287aaa" stroke-width="6" stroke-linecap="round"/><text x="415" y="280" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="500">大雨で排水が追いつかない</text><text x="415" y="327" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="21" font-weight="500">道路や低い場所に水がたまる</text><rect x="440" y="405" width="370" height="26" rx="12" fill="#287aaa" stroke="none"/><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>