<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">家屋倒壊等氾濫想定区域</title><desc id="dsc">家屋倒壊等氾濫想定区域を地図で確認する必要を示す概念図。具体区域は示さない。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">家屋倒壊等氾濫想定区域</text><path d="M160 290 L230 225 L300 290" fill="none" stroke="#18384a" stroke-width="6" stroke-linejoin="round"/><rect x="178" y="290" width="104" height="95" rx="4" fill="white" stroke="#18384a" stroke-width="4"/><rect x="218" y="330" width="28" height="55" fill="#d8ecf4" stroke="#18384a" stroke-width="3"/><rect x="480" y="155" width="380" height="200" rx="12" fill="white" stroke="none"/><text x="510" y="210" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="500">強い流れ・河岸侵食</text><text x="510" y="255" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="21" font-weight="500">建物への危険を確認</text><text x="510" y="302" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="21" font-weight="500">区域内か地図で調べる</text><path d="M70 435 L840 435" fill="none" stroke="#287aaa" stroke-width="9" stroke-linecap="round"/><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>