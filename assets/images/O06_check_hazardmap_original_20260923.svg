<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">私の水害リスクを調べる</title><desc id="dsc">公式サイトの操作手順を抽象化した図。実際の画面ではない。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">私の水害リスクを調べる</text><rect x="50" y="155" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="50" y="155" width="265" height="12" rx="5" fill="#d8ecf4" stroke="none"/><text x="68" y="211" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">① 住所を探す</text><text x="68" y="258" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">公式地図を開く</text><rect x="348" y="155" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="348" y="155" width="265" height="12" rx="5" fill="#eab85c" stroke="none"/><text x="366" y="211" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">② 災害を選ぶ</text><text x="366" y="258" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">洪水・内水・高潮</text><rect x="646" y="155" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="646" y="155" width="265" height="12" rx="5" fill="#4f9272" stroke="none"/><text x="664" y="211" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">③ 内容を読む</text><text x="664" y="258" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">深さ・時間・区域</text><text x="65" y="405" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="24" font-weight="500">自治体の最新版ハザードマップも確認しましょう</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>