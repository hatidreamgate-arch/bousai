<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">水害情報を調べる</title><desc id="dsc">キキクル・川の防災情報・自治体の役割を示す模式図。実際の画面ではない。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">水害情報を調べる</text><rect x="50" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="50" y="160" width="265" height="12" rx="5" fill="#d8ecf4" stroke="none"/><text x="68" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">気象庁 キキクル</text><text x="68" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">雨の危険度を確認</text><rect x="348" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="348" y="160" width="265" height="12" rx="5" fill="#4f9272" stroke="none"/><text x="366" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">川の防災情報</text><text x="366" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">水位・雨量を確認</text><rect x="646" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="646" y="160" width="265" height="12" rx="5" fill="#eab85c" stroke="none"/><text x="664" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">自治体の情報</text><text x="664" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">避難情報を確認</text><text x="135" y="415" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="24" font-weight="500">最新の情報は各公式サイトで確かめましょう</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>