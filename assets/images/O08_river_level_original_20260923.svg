<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">水位グラフの見方（イメージ）</title><desc id="dsc">架空の折れ線。観測所の実測値や避難判断の基準を表さない。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">水位グラフの見方（イメージ）</text><rect x="72" y="130" width="815" height="330" rx="12" fill="white" stroke="none"/><path d="M145 385 L790 385" fill="none" stroke="#18384a" stroke-width="4" stroke-linecap="round"/><path d="M145 180 L145 385" fill="none" stroke="#18384a" stroke-width="4" stroke-linecap="round"/><path d="M150 355 L250 350 L350 330 L450 300 L550 270 L650 230 L770 205" fill="none" stroke="#287aaa" stroke-width="7"/><path d="M145 255 L790 255" fill="none" stroke="#d46e62" stroke-width="3" stroke-linecap="round"/><text x="640" y="247" fill="#d46e62" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">基準線の例</text><text x="650" y="416" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="19" font-weight="500">時間 →</text><text x="72" y="195" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="19" font-weight="500">水位 ↑</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>