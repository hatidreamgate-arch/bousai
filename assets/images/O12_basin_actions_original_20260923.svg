<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">流域治水｜私たちにできること</title><desc id="dsc">雨水タンク・雨庭・地域活動の概念図。効果量を示さない。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">流域治水｜私たちにできること</text><rect x="50" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="50" y="160" width="265" height="12" rx="5" fill="#d8ecf4" stroke="none"/><text x="68" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">家でためる</text><text x="68" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">雨水タンク</text><rect x="348" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="348" y="160" width="265" height="12" rx="5" fill="#4f9272" stroke="none"/><text x="366" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">地面にしみ込ませる</text><text x="366" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">雨庭・浸透</text><rect x="646" y="160" width="265" height="168" rx="18" fill="white" stroke="none"/><rect x="646" y="160" width="265" height="12" rx="5" fill="#eab85c" stroke="none"/><text x="664" y="216" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="700">地域で備える</text><text x="664" y="263" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="18" font-weight="500">防災活動に参加</text><text x="105" y="421" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="23" font-weight="500">できることから、地域と一緒に取り組む</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>