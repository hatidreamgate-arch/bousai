<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">洪水のしくみ</title><desc id="dsc">川の水位が上がり住宅地に広がる模式図。</desc><rect width="960" height="540" fill="#f4f9fa"/><text x="48" y="66" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="30" font-weight="700">洪水のしくみ</text><path d="M170 300 L240 235 L310 300" fill="none" stroke="#18384a" stroke-width="6" stroke-linejoin="round"/><rect x="188" y="300" width="104" height="95" rx="4" fill="white" stroke="#18384a" stroke-width="4"/><rect x="228" y="340" width="28" height="55" fill="#d8ecf4" stroke="#18384a" stroke-width="3"/><rect x="48" y="415" width="864" height="72" rx="12" fill="#287aaa" stroke="none"/><path d="M70 397 L880 397" fill="none" stroke="#287aaa" stroke-width="8" stroke-linecap="round"/><text x="540" y="170" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="25" font-weight="500">大雨で川の水位が上がる</text><text x="540" y="219" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="21" font-weight="500">川から水があふれる・堤防が決壊</text><text x="65" y="389" fill="#18384a" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="20" font-weight="500">川</text><text x="48" y="515" fill="#526c78" font-family="Hiragino Sans,Noto Sans JP,sans-serif" font-size="16" font-weight="500">オリジナル図解・模式図｜数値や実際の危険度は公式情報で確認</text></svg>